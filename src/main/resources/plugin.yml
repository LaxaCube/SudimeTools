name: SudimeTools
version: '1.0'
main: ch.laxacube.sudimetools.SudimeTools
api-version: '1.21'
author: LaxaCube
description: Comportements custom des outils en Sudime (items CraftEngine).
softdepend: [PlaceholderAPI, CraftEngine]
commands:
  sudimetools:
    description: Debug / contrôle des outils en Sudime.
    usage: /sudimetools <id|dump|selftest|magnet|drawer|moon> [joueur]
    aliases: [sdt]
  lune:
    description: Va sur la Lune (armure lunaire complète requise) et revient.
    usage: /lune
permissions:
  sudime.moon:
    description: Accès à la Lune tant qu'elle n'est pas encore ouverte.
    default: op
  sudime.admin:
    description: Accès à /sudimetools.
    default: op
